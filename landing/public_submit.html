<!DOCTYPE html>
<html lang="en">
<head>
<!--
  =============================================================================
  landing/public_submit.html

  Public ticket submission form — no login required.

  TABLE OF CONTENTS
  -----------------
  1. META & FONTS          — Head, SEO, Google Fonts
  2. CSS DESIGN SYSTEM     — Variables, resets, layout, components
  3. FORM STYLES           — Input, textarea, button, status states
  4. ANIMATIONS            — Entrance animations, particles, 3D shapes
  5. RESPONSIVE            — Mobile breakpoints
  6. HTML STRUCTURE         — Form layout, branding, footer
  7. JAVASCRIPT            — API calls, form handling, workspace loading
  =============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Request — TriageIQ</title>
<meta name="description" content="Submit a support request or feedback. Your message is automatically categorized and prioritized.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ===================================================================== -->
<!-- region 2. CSS DESIGN SYSTEM                                           -->
<!-- ===================================================================== -->
<style>
  :root {
    --bg: #0A0E1A;
    --bg-alt: #0F1424;
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(0,212,255,0.5);
    --text: #E8E4DC;
    --text-muted: #6B7280;
    --text-dim: #4B5060;
    --primary: #00D4FF;
    --primary-glow: rgba(0,212,255,0.15);
    --amber: #F2A93B;
    --amber-glow: rgba(242,169,59,0.15);
    --success: #10B981;
    --success-glow: rgba(16,185,129,0.15);
    --error: #EF4444;
    --error-glow: rgba(239,68,68,0.15);
    --warning: #F59E0B;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Background gradient --- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,212,255,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(242,169,59,0.05), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 580px;
    padding: 40px 24px;
  }

  /* endregion */

  /* =================================================================== */
  /* region 3. FORM STYLES                                               */
  /* =================================================================== */

  .brand-header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeInUp 0.6s ease;
  }

  .brand-header .sector-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--primary);
    background: var(--primary-glow);
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: inline-block;
    margin-bottom: 12px;
  }

  .brand-header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .brand-header .description {
    color: var(--text-muted);
    font-size: 0.92rem;
    max-width: 44ch;
    margin: 0 auto;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    backdrop-filter: blur(12px);
    animation: fadeInUp 0.6s ease 0.1s both;
  }

  .form-card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-card h2::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 2px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field label .optional {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  .field input, .field textarea {
    width: 100%;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .field input::placeholder, .field textarea::placeholder {
    color: var(--text-dim);
  }

  .field textarea {
    min-height: 120px;
    resize: vertical;
  }

  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), #0099CC);
    color: #041015;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px 24px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px var(--primary-glow);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* endregion */

  /* =================================================================== */
  /* region: STATUS STATES                                               */
  /* =================================================================== */

  .status-message {
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    display: none;
    animation: fadeInUp 0.3s ease;
  }

  .status-message.success {
    display: block;
    background: var(--success-glow);
    border: 1px solid rgba(16,185,129,0.3);
    color: var(--success);
  }

  .status-message.error {
    display: block;
    background: var(--error-glow);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--error);
  }

  .status-message.warning {
    display: block;
    background: var(--amber-glow);
    border: 1px solid rgba(242,169,59,0.3);
    color: var(--amber);
  }

  .status-message .ticket-id {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 1.1rem;
    display: block;
    margin-top: 6px;
  }

  .status-link {
    display: inline-block;
    margin-top: 8px;
    color: var(--primary);
    font-size: 0.85rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* --- Contact info bar --- */
  .contact-bar {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    color: var(--text-muted);
    display: none;
    animation: fadeInUp 0.4s ease 0.2s both;
  }

  .contact-bar.visible {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .contact-bar span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* --- Footer --- */
  .footer {
    text-align: center;
    margin-top: 32px;
    padding-bottom: 24px;
    animation: fadeInUp 0.6s ease 0.3s both;
  }

  .footer .powered {
    font-size: 0.76rem;
    color: var(--text-dim);
  }

  .footer .powered a {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
  }

  .footer .powered a:hover {
    color: var(--primary);
  }

  /* --- Loading state --- */
  .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--error);
  }

  /* endregion */

  /* =================================================================== */
  /* region 4. ANIMATIONS                                                */
  /* =================================================================== */

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* endregion */

  /* =================================================================== */
  /* region 5. RESPONSIVE                                                */
  /* =================================================================== */

  @media (max-width: 600px) {
    .container { padding: 24px 16px; }
    .form-card { padding: 24px 20px; }
    .brand-header h1 { font-size: 1.4rem; }
  }

  /* endregion */
</style>
</head>

<!-- =================================================================== -->
<!-- region 6. HTML STRUCTURE                                            -->
<!-- =================================================================== -->
<body>

<div class="container">
  <!-- Loading state shown while fetching workspace info -->
  <div id="loadingState" class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading workspace...</p>
  </div>

  <!-- Error state if workspace not found -->
  <div id="errorState" class="error-state" style="display:none;">
    <p style="font-size:2rem;margin-bottom:12px;">😕</p>
    <p id="errorText">Workspace not found.</p>
    <p style="margin-top:12px;color:var(--text-dim);font-size:0.85rem;">
      Check the URL and try again, or contact the business directly.
    </p>
  </div>

  <!-- Main form (shown after workspace loads) -->
  <div id="mainContent" style="display:none;">
    <div class="brand-header">
      <span class="sector-tag" id="sectorTag"></span>
      <h1 id="businessName"></h1>
      <p class="description" id="businessDescription"></p>
    </div>

    <div class="form-card">
      <h2>Submit a Request</h2>

      <form id="submitForm" autocomplete="off">
        <div class="field">
          <label for="userName">Your name</label>
          <input type="text" id="userName" name="name" placeholder="e.g. John Smith" required>
        </div>

        <div class="field">
          <label for="userEmail">Email <span class="optional">(optional — for follow-up)</span></label>
          <input type="email" id="userEmail" name="email" placeholder="e.g. john@example.com">
        </div>

        <div class="field">
          <label for="userMessage">What can we help you with?</label>
          <textarea id="userMessage" name="message" placeholder="Describe your issue or question..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Submit Request
        </button>
      </form>

      <div id="statusMessage" class="status-message"></div>
    </div>

    <div id="contactBar" class="contact-bar">
      <span id="contactPhone"></span>
      <span id="contactEmail"></span>
    </div>

    <div class="footer">
      <p class="powered">Powered by <a href="#">TriageIQ</a> — AI-powered support triage</p>
    </div>
  </div>
</div>

<!-- endregion -->

<!-- =================================================================== -->
<!-- region 7. JAVASCRIPT                                                -->
<!-- =================================================================== -->
<script>
// ==========================================================================
// region: CONFIGURATION
// ==========================================================================

// API base URL — change this when deploying
const API_BASE = window.location.origin.includes('localhost')
  ? 'http://localhost:8001'
  : window.location.origin;

// Read workspace slug from URL: ?workspace=acme-plumbing
const params = new URLSearchParams(window.location.search);
const workspaceSlug = params.get('workspace') || params.get('w');

// endregion

// ==========================================================================
// region: DOM REFERENCES
// ==========================================================================

const loadingState = document.getElementById('loadingState');
const errorState = document.getElementById('errorState');
const errorText = document.getElementById('errorText');
const mainContent = document.getElementById('mainContent');
const sectorTag = document.getElementById('sectorTag');
const businessName = document.getElementById('businessName');
const businessDescription = document.getElementById('businessDescription');
const submitForm = document.getElementById('submitForm');
const submitBtn = document.getElementById('submitBtn');
const statusMessage = document.getElementById('statusMessage');
const contactBar = document.getElementById('contactBar');
const contactPhone = document.getElementById('contactPhone');
const contactEmail = document.getElementById('contactEmail');

// endregion

// ==========================================================================
// region: WORKSPACE LOADING
// ==========================================================================

async function loadWorkspace() {
  if (!workspaceSlug) {
    showError('No workspace specified. Add ?workspace=your-workspace-id to the URL.');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/workspace/${encodeURIComponent(workspaceSlug)}`);
    if (!res.ok) {
      showError(`Workspace "${workspaceSlug}" not found. Check the URL and try again.`);
      return;
    }

    const data = await res.json();

    // Update page title
    document.title = `Contact ${data.name} — Powered by TriageIQ`;

    // Populate branding
    sectorTag.textContent = data.sector_name;
    businessName.textContent = data.name;

    if (data.business_description) {
      businessDescription.textContent = data.business_description;
      businessDescription.style.display = 'block';
    } else {
      businessDescription.style.display = 'none';
    }

    // Contact info
    let hasContact = false;
    if (data.contact_phone) {
      contactPhone.innerHTML = `📞 ${data.contact_phone}`;
      hasContact = true;
    }
    if (data.contact_email) {
      contactEmail.innerHTML = `✉️ ${data.contact_email}`;
      hasContact = true;
    }
    if (hasContact) {
      contactBar.classList.add('visible');
    }

    // Show form
    loadingState.style.display = 'none';
    mainContent.style.display = 'block';

  } catch (err) {
    showError('Unable to connect to the server. Please try again later.');
    console.error('Workspace load error:', err);
  }
}

function showError(msg) {
  loadingState.style.display = 'none';
  errorText.textContent = msg;
  errorState.style.display = 'block';
}

// endregion

// ==========================================================================
// region: FORM SUBMISSION
// ==========================================================================

submitForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('userName').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  const message = document.getElementById('userMessage').value.trim();

  if (!name || !message) {
    showStatus('error', 'Please fill in your name and message.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';
  statusMessage.className = 'status-message';
  statusMessage.style.display = 'none';

  try {
    const res = await fetch(`${API_BASE}/api/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspace: workspaceSlug,
        name,
        email,
        message,
      }),
    });

    const data = await res.json();

    if (data.relevant === false) {
      // Irrelevant message — sector filter caught it
      let msg = data.message;
      if (data.emergency && data.emergency_text) {
        msg = `⚠️ ${data.emergency_text}\n\n${msg}`;
      }
      showStatus('warning', msg);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Request';
      return;
    }

    if (!res.ok) {
      showStatus('error', data.detail || 'Something went wrong. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Request';
      return;
    }

    if (data.duplicate) {
      showStatus('warning',
        `This matches an existing request — ${data.existing_ticket_id}. ` +
        `We've noted your follow-up.`
      );
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Request';
      return;
    }

    // Success
    const statusUrl = `ticket_status.html?workspace=${workspaceSlug}&ticket=${data.ticket_id}`;
    showStatus('success',
      `✅ Got it! Your request has been received and categorized as <strong>${data.category}</strong>.` +
      `<span class="ticket-id">${data.ticket_id}</span>` +
      `<a href="${statusUrl}" class="status-link">Check ticket status →</a>`
    );

    // Reset form
    submitForm.reset();
    submitBtn.textContent = 'Submit Another Request';
    submitBtn.disabled = false;

  } catch (err) {
    showStatus('error', 'Unable to connect to the server. Please try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Request';
    console.error('Submit error:', err);
  }
});

function showStatus(type, html) {
  statusMessage.className = `status-message ${type}`;
  statusMessage.innerHTML = html;
  statusMessage.style.display = 'block';
  statusMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// endregion

// ==========================================================================
// region: INIT
// ==========================================================================

loadWorkspace();

// endregion
</script>
<!-- endregion -->
</body>
</html>
