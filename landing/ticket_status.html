<!DOCTYPE html>
<html lang="en">
<head>
<!--
  =============================================================================
  landing/ticket_status.html

  Customer-facing ticket status page — check ticket progress without login.

  TABLE OF CONTENTS
  -----------------
  1. META & FONTS          — Head, SEO, Google Fonts
  2. CSS STYLES            — Variables, components, status badges
  3. ANIMATIONS            — Entrance, spinner
  4. HTML STRUCTURE         — Status card layout
  5. JAVASCRIPT            — API calls, URL parsing, display
  =============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Status — TriageIQ</title>
<meta name="description" content="Check the status of your support ticket.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ===================================================================== -->
<!-- region 2. CSS STYLES                                                  -->
<!-- ===================================================================== -->
<style>
  :root {
    --bg: #0A0E1A;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --text: #E8E4DC;
    --text-muted: #6B7280;
    --text-dim: #4B5060;
    --primary: #00D4FF;
    --primary-glow: rgba(0,212,255,0.15);
    --amber: #F2A93B;
    --success: #10B981;
    --error: #EF4444;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,212,255,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(242,169,59,0.05), transparent);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 48px 24px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeInUp 0.5s ease;
  }

  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .header .workspace-name {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    backdrop-filter: blur(12px);
    animation: fadeInUp 0.5s ease 0.1s both;
  }

  .ticket-id-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    color: var(--primary);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .info-item {
    padding: 14px 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .info-item .label {
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .info-item .value {
    font-size: 0.95rem;
    font-weight: 500;
  }

  /* Status badges */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .badge-open {
    background: rgba(0,212,255,0.15);
    color: var(--primary);
    border: 1px solid rgba(0,212,255,0.3);
  }

  .badge-pending {
    background: rgba(242,169,59,0.15);
    color: var(--amber);
    border: 1px solid rgba(242,169,59,0.3);
  }

  .badge-closed {
    background: rgba(16,185,129,0.15);
    color: var(--success);
    border: 1px solid rgba(16,185,129,0.3);
  }

  .badge-high {
    background: rgba(239,68,68,0.15);
    color: var(--error);
    border: 1px solid rgba(239,68,68,0.3);
  }

  .badge-medium {
    background: rgba(242,169,59,0.15);
    color: var(--amber);
    border: 1px solid rgba(242,169,59,0.3);
  }

  .badge-low {
    background: rgba(16,185,129,0.15);
    color: var(--success);
    border: 1px solid rgba(16,185,129,0.3);
  }

  /* Lookup form */
  .lookup-form {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .lookup-row {
    display: flex;
    gap: 8px;
  }

  .lookup-row input {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
  }

  .lookup-row input:focus {
    border-color: rgba(0,212,255,0.5);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .lookup-row button {
    background: var(--primary);
    color: #041015;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .lookup-row button:hover { filter: brightness(1.1); }

  /* States */
  .loading-state, .error-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .error-state { color: var(--error); }

  .loading-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.76rem;
    color: var(--text-dim);
    animation: fadeInUp 0.5s ease 0.2s both;
  }

  .footer a {
    color: var(--text-muted);
    text-decoration: none;
  }

  .footer a:hover { color: var(--primary); }

  .new-request-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: var(--primary);
    font-size: 0.85rem;
    text-decoration: none;
    animation: fadeInUp 0.5s ease 0.15s both;
  }

  .new-request-link:hover { text-decoration: underline; }

  /* endregion */

  /* region 3. ANIMATIONS */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 500px) {
    .info-grid { grid-template-columns: 1fr; }
    .container { padding: 32px 16px; }
  }
  /* endregion */
</style>
</head>

<!-- ===================================================================== -->
<!-- region 4. HTML STRUCTURE                                              -->
<!-- ===================================================================== -->
<body>
<div class="container">
  <div class="header">
    <h1>📋 Ticket Status</h1>
    <p class="workspace-name" id="workspaceName"></p>
  </div>

  <!-- Loading -->
  <div id="loadingState" class="status-card">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Looking up your ticket...</p>
    </div>
  </div>

  <!-- Ticket info (populated by JS) -->
  <div id="ticketCard" class="status-card" style="display:none;">
    <div class="ticket-id-display" id="ticketIdDisplay"></div>
    <div class="info-grid">
      <div class="info-item">
        <div class="label">Status</div>
        <div class="value" id="ticketStatus"></div>
      </div>
      <div class="info-item">
        <div class="label">Urgency</div>
        <div class="value" id="ticketUrgency"></div>
      </div>
      <div class="info-item">
        <div class="label">Category</div>
        <div class="value" id="ticketCategory"></div>
      </div>
      <div class="info-item">
        <div class="label">Submitted</div>
        <div class="value" id="ticketDate"></div>
      </div>
    </div>

    <div class="lookup-form">
      <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px;">Look up another ticket:</p>
      <div class="lookup-row">
        <input type="text" id="lookupInput" placeholder="e.g. TCK1001">
        <button id="lookupBtn">Check</button>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorCard" class="status-card" style="display:none;">
    <div class="error-state">
      <p style="font-size:1.8rem;margin-bottom:8px;">😕</p>
      <p id="errorText">Ticket not found.</p>
    </div>
    <div class="lookup-form">
      <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px;">Try a different ticket ID:</p>
      <div class="lookup-row">
        <input type="text" id="errorLookupInput" placeholder="e.g. TCK1001">
        <button id="errorLookupBtn">Check</button>
      </div>
    </div>
  </div>

  <a class="new-request-link" id="newRequestLink" style="display:none;" href="#">
    ← Submit a new request
  </a>

  <div class="footer">
    <p>Powered by <a href="#">TriageIQ</a></p>
  </div>
</div>

<!-- endregion -->

<!-- ===================================================================== -->
<!-- region 5. JAVASCRIPT                                                  -->
<!-- ===================================================================== -->
<script>
// region: CONFIG
const API_BASE = window.location.origin.includes('localhost')
  ? 'http://localhost:8001'
  : window.location.origin;

const params = new URLSearchParams(window.location.search);
const workspaceSlug = params.get('workspace') || params.get('w');
const ticketId = params.get('ticket') || params.get('t');
// endregion

// region: FETCH STATUS
async function fetchStatus(slug, tid) {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('ticketCard').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';

  if (!slug) {
    showError('No workspace specified in the URL.');
    return;
  }
  if (!tid) {
    showError('No ticket ID specified. Add &ticket=TCK1001 to the URL.');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/status/${encodeURIComponent(slug)}/${encodeURIComponent(tid)}`);

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.detail || `Ticket "${tid}" not found.`);
      return;
    }

    const data = await res.json();
    showTicket(data);
  } catch (err) {
    showError('Unable to connect to the server. Please try again.');
    console.error(err);
  }
}

function showTicket(data) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('ticketCard').style.display = 'block';
  document.getElementById('workspaceName').textContent = data.workspace_name;
  document.getElementById('ticketIdDisplay').textContent = data.ticket_id;

  // Status badge
  const statusEl = document.getElementById('ticketStatus');
  const statusClass = data.status.toLowerCase() === 'open' ? 'badge-open'
    : data.status.toLowerCase() === 'pending' ? 'badge-pending'
    : data.status.toLowerCase() === 'closed' ? 'badge-closed'
    : 'badge-open';
  statusEl.innerHTML = `<span class="badge ${statusClass}">${data.status}</span>`;

  // Urgency badge
  const urgencyEl = document.getElementById('ticketUrgency');
  const urgencyClass = data.urgency === 'High' ? 'badge-high'
    : data.urgency === 'Medium' ? 'badge-medium'
    : 'badge-low';
  urgencyEl.innerHTML = `<span class="badge ${urgencyClass}">${data.urgency}</span>`;

  document.getElementById('ticketCategory').textContent = data.category;
  document.getElementById('ticketDate').textContent = data.created_at;

  // Show new request link
  const link = document.getElementById('newRequestLink');
  if (workspaceSlug) {
    link.href = `public_submit.html?workspace=${workspaceSlug}`;
    link.style.display = 'block';
  }

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set('ticket', data.ticket_id);
  history.replaceState(null, '', url);
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorCard').style.display = 'block';
  document.getElementById('errorText').textContent = msg;
}
// endregion

// region: LOOKUP HANDLERS
function handleLookup(inputId) {
  const val = document.getElementById(inputId).value.trim();
  if (val) fetchStatus(workspaceSlug, val);
}

document.getElementById('lookupBtn').addEventListener('click', () => handleLookup('lookupInput'));
document.getElementById('lookupInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLookup('lookupInput');
});
document.getElementById('errorLookupBtn').addEventListener('click', () => handleLookup('errorLookupInput'));
document.getElementById('errorLookupInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLookup('errorLookupInput');
});
// endregion

// region: INIT
if (ticketId) {
  fetchStatus(workspaceSlug, ticketId);
} else {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorCard').style.display = 'block';
  document.getElementById('errorText').textContent = 'Enter a ticket ID to check its status.';
}
// endregion
</script>
<!-- endregion -->
</body>
</html>
